name: Static demo coverage
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: adwais_contract
          POSTGRES_PASSWORD: adwais-local-contract
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d adwais_contract"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: pnpm install --frozen-lockfile
      - name: Regenerate upstream OpenAPI and check the committed clients
        run: |
          cp docs/openapi/v1.json "$RUNNER_TEMP/adwais-openapi.json"
          pnpm codegen
          node apps/web/scripts/check-openapi.mjs "$RUNNER_TEMP/adwais-openapi.json"
          git diff --exit-code -- apps/web/src/api/generated packages/types/generated
      - name: Verify static handlers and compare selected upstream responses
        env:
          ConnectionStrings__AnalyticsDb: Host=127.0.0.1;Database=adwais_contract;Username=postgres;Password=adwais-local-contract
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://127.0.0.1:5020
          Authentication__EnableDemoAccess: 'true'
          Authentication__KioskJwtSecret: local-coverage-only-12345678901234567890
          ADWAIS_CONTRACT_URL: http://127.0.0.1:5020
        run: |
          dotnet apps/server/ADWAIS/src/Api/bin/Debug/net10.0/Adwais.Api.dll > "$RUNNER_TEMP/adwais-api.log" 2>&1 &
          for attempt in {1..60}; do
            if curl --silent --fail "$ADWAIS_CONTRACT_URL/health/ready" >/dev/null; then break; fi
            sleep 1
          done
          curl --silent --fail "$ADWAIS_CONTRACT_URL/health/ready" || { tail -100 "$RUNNER_TEMP/adwais-api.log"; exit 1; }
          mkdir -p "$RUNNER_TEMP/demo-evidence"
          pnpm --filter web test --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/demo-evidence/vitest.json"

      - run: pnpm --filter web build:demo
      - name: Check Chromium and Firefox with only static assets
        run: |
          pnpm --filter web exec playwright install --with-deps chromium firefox
          node apps/web/scripts/serve-static-demo.mjs &
          for attempt in {1..20}; do
            if curl --silent --fail http://127.0.0.1:4174/ >/dev/null; then break; fi
            sleep 1
          done
          mkdir -p "$RUNNER_TEMP/demo-evidence"
          DEMO_TRACE="$RUNNER_TEMP/demo-evidence/chromium.zip" node apps/web/scripts/test-static-demo.mjs
          DEMO_BROWSER=firefox DEMO_TRACE="$RUNNER_TEMP/demo-evidence/firefox.zip" node apps/web/scripts/test-static-demo.mjs
      - name: Record build inputs and output digests
        run: |
          mkdir -p "$RUNNER_TEMP/demo-evidence"
          git rev-parse HEAD > "$RUNNER_TEMP/demo-evidence/fork-sha.txt"
          find apps/web/dist -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/demo-evidence/assets.sha256"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: static-demo-evidence
          path: ${{ runner.temp }}/demo-evidence
      - uses: actions/upload-artifact@v6
        with:
          name: static-demo-dist
          include-hidden-files: true
          path: apps/web/dist
